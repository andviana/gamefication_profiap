# /etc/nginx/sites-available/techquiz  (depois: ln -s em sites-enabled e "nginx -t && systemctl reload nginx")
# Troque techquiz.exemplo.ufra.edu.br pelo nome real e ajuste os caminhos do certificado da instituição.

# Limite extra em camada de rede (o app tem o seu, que só conta tentativas falhas): protege a API contra rajadas.
limit_req_zone $binary_remote_addr zone=techquiz_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=techquiz_login:10m rate=2r/s;

upstream techquiz_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name techquiz.exemplo.ufra.edu.br;
    # nada é servido em HTTP: o cookie de sessão é "Secure" e o gabarito/HTTPS dependem disso
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name techquiz.exemplo.ufra.edu.br;

    ssl_certificate     /etc/ssl/certs/techquiz.fullchain.pem;
    ssl_certificate_key /etc/ssl/private/techquiz.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 5m;          # 2 CSVs de até 2 MB cada + folga (o app também confere)
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;

    # Arquivos estáticos direto do disco (o app não precisa atendê-los).
    location /static/ {
        alias /opt/techquiz/app/app/static/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location = /entrar {
        limit_req zone=techquiz_login burst=10 nodelay;
        include /etc/nginx/techquiz-proxy.inc;
    }

    location /api/ {
        limit_req zone=techquiz_api burst=60 nodelay;
        include /etc/nginx/techquiz-proxy.inc;
    }

    location / {
        include /etc/nginx/techquiz-proxy.inc;
    }
}
