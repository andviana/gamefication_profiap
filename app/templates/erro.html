<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erro {{ status }}</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8f8f8; color: #333;
           font-family: Raleway, "Segoe UI", system-ui, sans-serif; }
    main { max-width: 520px; padding: 32px 24px; text-align: center; }
    .codigo { font-size: 64px; font-weight: 700; color: #1351b4; line-height: 1; }
    h1 { font-size: 20px; margin: 12px 0 8px; }
    a { color: #1351b4; }
  </style>
</head>
<body>
  <main>
    <div class="codigo">{{ status }}</div>
    <h1>{{ mensagem }}</h1>
    <p><a href="/">Voltar ao início</a></p>
  </main>
</body>
</html>
